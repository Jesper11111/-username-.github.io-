<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>屠龍勇者</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12100c">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="屠龍勇者">
<style>
    :root {
        --bg: #12100c; --panel: #1f1b15; --panel2: #2c261d; --line: #3d3427;
        --text: #efe6d2; --muted: #9d927d; --gold: #e8c066; --accent: #a8432e; --accent2: #c25a3c;
        --hp: #c8423a; --mp: #3d78c8; --exp: #d8b44a; --good: #7fc46a; --warn: #e0a64a; --bad: #e0605a;
        --rare: #c58cff; --ench: #ffd34d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
        background: radial-gradient(ellipse at 50% -10%, #3a2a18, var(--bg) 65%) fixed;
        color: var(--text); font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px;
    }
    #app { max-width: 600px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
    button {
        font: inherit; color: var(--text); background: var(--accent); border: 1px solid #0003; border-radius: 8px;
        padding: 9px 12px; cursor: pointer; transition: filter .15s, transform .05s;
    }
    button:hover:not(:disabled) { filter: brightness(1.15); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { opacity: .4; cursor: default; }
    button.secondary { background: var(--panel2); border-color: var(--line); }
    button.danger { background: #6b1f1f; }
    button.mini { padding: 4px 9px; font-size: 13px; }
    input[type=number], input[type=text], textarea {
        font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
    }
    input[type=number] { width: 70px; }
    input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent2); }
    textarea { width: 100%; height: 120px; font-size: 12px; word-break: break-all; }
    h4 { margin: 14px 0 8px; color: var(--gold); }
    .panel h4 { margin-top: 0; }
    small { font-size: 12px; }
    .list-row small, .zone-card > small { display: block; }
    .muted { color: var(--muted); }
    .good { color: var(--good); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .hidden { display: none !important; }
    .clickable { cursor: pointer; }

    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; flex: 1; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .notice { border-color: var(--warn); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .loc { font-weight: bold; font-size: 17px; color: var(--gold); }

    /* 標題 */
    #screen-title { align-items: center; justify-content: center; text-align: center; padding: 24px 16px; gap: 14px; }
    .logo { font-size: 80px; filter: drop-shadow(0 0 20px #c2433688); }
    #screen-title h1 { margin: 0; font-size: 46px; letter-spacing: 8px; color: var(--gold); text-shadow: 0 2px 0 #5a3a10, 0 0 24px #c2433688; }
    .subtitle { color: var(--muted); margin-top: -6px; }
    .title-btns { display: flex; flex-direction: column; gap: 10px; width: 240px; }
    .title-btns button { padding: 13px; font-size: 17px; }

    /* 創角 */
    #screen-create { padding: 16px; gap: 10px; }
    .class-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .class-card { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; background: var(--panel2); font-size: 13px; }
    .class-card.active { background: var(--accent); }
    .class-icon { font-size: 24px; }
    #create-desc p { margin: 6px 0; }
    .stat-row { display: grid; grid-template-columns: 1fr auto 44px auto; align-items: center; gap: 8px; padding: 3px 0; }
    .stat-row b { text-align: center; font-size: 17px; }
    .points-left { text-align: right; margin-top: 6px; color: var(--gold); }

    /* 遊戲主畫面 */
    #screen-game { height: 100vh; height: 100dvh; }
    #status { padding: 10px 16px 8px; background: #0009; border-bottom: 1px solid var(--line); }
    .st-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .st-gold { margin-left: auto; color: var(--gold); }
    .title-badge { background: linear-gradient(90deg, #8a2d1f, #c8902c); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
    .st-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .st-row { display: flex; justify-content: space-between; font-size: 12px; margin: 5px 0 3px; color: var(--muted); }
    .bar { position: relative; height: 18px; background: #0008; border-radius: 4px; overflow: hidden; font-size: 12px; border: 1px solid #0006; }
    .bar.thin { height: 4px; border: 0; }
    .bar-fill { height: 100%; transition: width .2s; }
    .bar span { position: absolute; inset: 0; text-align: center; line-height: 17px; text-shadow: 0 1px 2px #000; }
    .bar.hp .bar-fill { background: linear-gradient(#e0574d, var(--hp)); }
    .bar.mp .bar-fill { background: linear-gradient(#5591e0, var(--mp)); }
    .bar.exp .bar-fill { background: var(--exp); }
    .bar.wt .bar-fill { background: #8a7a55; }
    #tabs { display: grid; grid-template-columns: repeat(7, 1fr); background: #0006; border-bottom: 1px solid var(--line); }
    .tab { background: none; border: 0; border-radius: 0; padding: 7px 0 5px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; }
    .tab span { font-size: 18px; }
    .tab.active { color: var(--gold); box-shadow: inset 0 -2px 0 var(--gold); }
    #panel { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }

    /* 狩獵 */
    .mon-card { display: flex; align-items: center; gap: 12px; min-height: 76px; }
    .mon-icon { font-size: 44px; width: 56px; text-align: center; animation: bob 1.6s ease-in-out infinite; }
    .mon-icon.boss { font-size: 52px; filter: drop-shadow(0 0 10px var(--hp)); }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    .mon-info { flex: 1; display: grid; gap: 4px; }
    .mon-wait { color: var(--muted); width: 100%; text-align: center; }
    .buffs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .chip { background: #2a4a2a; border: 1px solid #3f6a3f; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .session { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: grid; gap: 2px; }
    .log { height: 300px; overflow-y: auto; font-size: 13px; line-height: 1.5; padding: 8px 10px; background: #0007; }
    .log-line.miss { color: #8a8070; }
    .log-line.hurt { color: #ff8f80; }
    .log-line.heal { color: #8fd0ff; }
    .log-line.magic { color: #b9a6ff; }
    .log-line.crit { color: var(--ench); }
    .log-line.win { color: var(--good); }
    .log-line.loot { color: #d8cfa8; }
    .log-line.rare { color: var(--rare); font-weight: bold; }
    .log-line.lvup { color: var(--gold); font-weight: bold; }
    .log-line.boss, .log-line.dead { color: var(--bad); font-weight: bold; }
    .log-line.warn { color: var(--warn); }
    .log-line.sys { color: #9fc8c0; }

    /* 地圖 */
    .zone-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .zone-card.dragon { border-color: #6b2a20; background: linear-gradient(90deg, #2e1510, var(--panel)); }
    .zone-card.tower { border-color: #5a4a2a; }
    .zone-head { display: flex; align-items: center; gap: 8px; }
    .zone-head small { margin-left: auto; }
    .zone-icon { font-size: 22px; }
    .zone-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .tower-pick { font-size: 13px; }

    /* 角色 */
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stat-cell { background: var(--panel2); border-radius: 6px; padding: 6px 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .stat-cell span { color: var(--muted); font-size: 13px; }
    .stat-cell b { font-size: 17px; }
    .kv-grid { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 10px; font-size: 14px; }
    .kv-grid span { color: var(--muted); }
    .equip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .equip-slot { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px; font-size: 13px; text-align: left; display: flex; flex-direction: column; min-height: 48px; }
    .equip-slot small { color: var(--muted); }
    .equip-slot.filled { border-color: #6a5a3a; }
    .exp-line { margin-top: 6px; font-size: 13px; }
    .dragon-list { line-height: 1.8; margin: 8px 0 0; }

    /* 背包、清單 */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip-btn { background: var(--panel2); border-color: var(--line); padding: 5px 12px; border-radius: 16px; font-size: 13px; }
    .chip-btn.active { background: var(--accent); }
    .list { display: grid; gap: 5px; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; border-radius: 8px; }
    .list-row.locked { opacity: .5; }
    .list-row > div:first-child { min-width: 0; }
    .item-row { display: flex; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); text-align: left; }
    .qty-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .ench-hi { color: var(--ench); font-weight: bold; }
    .rare-item { color: var(--rare); }
    .cursed { color: var(--bad); }
    .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
    .set-row:last-of-type { border-bottom: 0; }

    /* 對話框、提示 */
    #dialog-layer { position: fixed; inset: 0; background: #000b; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    #dialog-layer.active { display: flex; }
    .dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: 100%; max-width: 440px; max-height: 86vh; display: flex; flex-direction: column; }
    .dialog h3 { margin: 0 0 10px; color: var(--gold); }
    .dialog-body { overflow-y: auto; line-height: 1.7; }
    .dialog-btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    #toast-layer { position: fixed; top: 14px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 20; }
    .toast { background: #000e; border: 1px solid var(--line); padding: 8px 16px; border-radius: 20px; animation: toast-in .2s; max-width: 90%; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }
    #pwa-update { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; background: var(--gold); color: #2a1a05; font-weight: bold; border-radius: 20px; padding: 10px 18px; }

    @media (max-width: 420px) {
        .class-grid { grid-template-columns: repeat(5, 1fr); }
        .class-card { font-size: 11px; }
        .kv-grid { grid-template-columns: auto 1fr; }
        .stat-grid, .equip-grid { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>
<div id="app">
    <!-- 標題 -->
    <section id="screen-title" class="screen">
        <div class="logo">🐉</div>
        <h1>屠龍勇者</h1>
        <div class="subtitle">四大龍甦醒，亞丁大陸等待勇者</div>
        <div class="title-btns">
            <button id="btn-continue" onclick="continueGame()">📜 繼續冒險</button>
            <button class="secondary" onclick="openCreate()">⚔️ 建立新角色</button>
            <button class="secondary" onclick="openInstallGuide()">📲 安裝到主畫面</button>
        </div>
        <small id="version" class="muted"></small>
    </section>

    <!-- 創角 -->
    <section id="screen-create" class="screen">
        <div class="loc">建立角色</div>
        <div id="create-classes" class="class-grid"></div>
        <div id="create-desc" class="panel"></div>
        <div class="panel">
            <h4>能力值分配 <small class="muted">（總點數 75，單項最高 18）</small></h4>
            <div id="create-stats"></div>
        </div>
        <div class="panel">
            <input id="create-name" type="text" maxlength="12" placeholder="角色名稱" style="width:100%">
        </div>
        <div class="btn-row">
            <button class="secondary" onclick="showTitle()">返回</button>
            <button onclick="confirmCreate()" style="flex:1">✅ 建立角色</button>
        </div>
    </section>

    <!-- 遊戲 -->
    <section id="screen-game" class="screen">
        <header id="status"></header>
        <nav id="tabs"></nav>
        <main id="panel"></main>
    </section>
</div>

<div id="dialog-layer"></div>
<div id="toast-layer"></div>

</body>
