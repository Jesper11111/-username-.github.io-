<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>泰坦墓穴・大地圖預覽</title><style>body{background:#191713;color:#eee;font:16px sans-serif;margin:20px}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}canvas,img{width:100%;border:1px solid #9b7b45}h1{color:#e6c179}@media(max-width:700px){section{grid-template-columns:1fr}}</style><h1>泰坦墓穴・Lv.72～88</h1><p>大地圖東南，腐朽礦坑・深層東側。西側石道連接既有地圖；怪物與掉落沿用遊戲泰坦墓穴。</p><section><div><h2>世界位置</h2><canvas id="world" width="1200" height="951"></canvas></div><div><h2>墓穴區域</h2><canvas id="detail" width="1000" height="1000"></canvas></div></section><script>const im=new Image();im.onload=()=>{const c=document.getElementById('world'),g=c.getContext('2d'),k=1200/im.width;g.drawImage(im,0,0,c.width,c.height);g.strokeStyle='#ffcf66';g.lineWidth=3;g.strokeRect(4512*k,2080*k,1504*k,1504*k);g.font='bold 20px sans-serif';g.fillStyle='#ffdf7c';g.fillText('泰坦墓穴',4512*k+12,2080*k+30);document.getElementById('detail').getContext('2d').drawImage(im,4512,2080,1504,1504,0,0,1000,1000);};im.src='../images/maps/wild-titan.jpg';</script></html>
