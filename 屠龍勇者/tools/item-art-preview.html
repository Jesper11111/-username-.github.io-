<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>原創道具圖庫</title>
<style>body{margin:20px;background:#16191f;color:#e8dfcd;font:15px sans-serif}header{position:sticky;top:0;background:#16191ff5;padding:10px;z-index:1}select,input{padding:8px;margin:4px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}article{border:1px solid #665339;border-radius:7px;padding:8px;text-align:center;background:#25221e}article .ico{display:block;width:80px;height:80px;margin:auto}img{width:100%;height:100%;object-fit:contain}small{display:block;color:#b4ac9c;margin-top:5px}h2{margin:4px;color:#f1cd7c}</style>
<header><h2>原創裝備・道具圖庫</h2><label>介面 <select id="view"><option value="gallery">道具圖庫</option><option value="bag">背包</option><option value="shop">商店</option><option value="char">角色裝備</option></select></label><label>分類 <select id="cat"><option value="all">全部</option><option value="weapon">武器</option><option value="armor">裝備</option><option value="material">材料／封魂石</option><option value="potion">藥水</option><option value="scroll">卷軸</option><option value="quest">任務道具</option><option value="currency">製作通貨</option><option value="map">異界地圖</option><option value="book">魔法書</option></select></label><input id="search" placeholder="輸入道具名稱"><p id="status">載入中…</p></header><main id="grid"></main><section id="sample" style="max-width:1000px;margin:auto;pointer-events:none"></section>
<script>
(async()=>{
const index=await(await fetch('../index.html')).text(),style=index.match(/<style>([\s\S]*?)<\/style>/)[1];
const css=document.createElement('style');css.textContent=style+'body{background:#16191f;overflow:auto;height:auto}.ico{display:block}';document.head.prepend(css);
for(const[,file]of index.matchAll(/<script src="(data\/[^"?]+\.js)\?v=/g)){if(/\/(main|pwa|cloud)\.js$/.test(file))continue;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='../'+file+'?v=20261021m';s.onload=resolve;s.onerror=reject;document.head.append(s);});}
SIM_MODE=true;
let renderSeq=0;
function render(){const seq=++renderSeq,mode=document.getElementById('view').value;document.getElementById('grid').hidden=mode!=='gallery';document.getElementById('grid').style.display=mode==='gallery'?'grid':'none';document.getElementById('sample').hidden=mode==='gallery';
if(mode!=='gallery'){
 if(!player){createPlayer('裝備圖片預覽','knight',CLASSES.knight.base);for(const id of ['longSword','silverDagger','dragonSlayer','knightHelm','dragonScaleMail','titanBelt','redPotion','teleScroll','elvenWafer','eternalSoul'])if(ITEMS[id])addItem(id,ITEMS[id].cat==='potion'?10:1);}
 const html=mode==='bag'?renderBag():mode==='shop'?renderShop():renderChar();document.getElementById('sample').innerHTML=html.replaceAll('src="images/','src="../images/');document.getElementById('status').textContent='真正遊戲的'+(mode==='bag'?'背包':mode==='shop'?'商店':'角色裝備')+'繪圖函式。隔離範例角色，不存檔／不上傳，按鈕只展示。';return;
}
const cat=document.getElementById('cat').value,q=document.getElementById('search').value.trim();const list=Object.entries(ITEMS).filter(([id,d])=>(cat==='all'||cat===d.cat)&&(!q||d.name.includes(q)));
document.getElementById('grid').innerHTML=list.map(([id,d])=>'<article>'+itemIconHtml(id).replaceAll('src="images/','src="../images/')+'<small>'+esc(d.name)+'</small></article>').join('');
const imgs=Array.from(document.querySelectorAll('#grid img'));Promise.all(imgs.map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=r;im.onerror=r;}))).then(()=>{if(seq!==renderSeq)return;document.getElementById('status').textContent='顯示 '+list.length+' 件｜成功載入 '+imgs.filter(im=>im.naturalWidth>0).length+' 張｜缺圖 '+imgs.filter(im=>!im.naturalWidth).length+' 張。全部 '+Object.keys(ITEM_IMG).length+' 張新圖；僅預覽，不載入存檔／雲端。';});}
document.getElementById('view').onchange=render;document.getElementById('cat').onchange=render;document.getElementById('search').oninput=render;render();
})().catch(e=>{document.getElementById('status').textContent=e.stack;console.error(e);});
</script></html>
