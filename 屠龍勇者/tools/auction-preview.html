<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width, initial-scale=1"><title>拍賣介面隔離預覽</title>
<style>#message-preview-tools{position:fixed;top:4px;left:4px;z-index:100;background:#17120de8;border:1px solid #aa8844;padding:4px;color:#fff;font:12px sans-serif}#message-preview-tools button{font-size:12px;padding:4px;margin:2px}</style></head><body>
<div id="message-preview-tools">隔離預覽，不讀寫角色存檔／不連外<br><button onclick="messagePreviewMode('pc')">PC</button><button onclick="messagePreviewMode('phone')">手機</button></div>
<script>
(async()=>{
 const memory=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)||null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k)}});
 const localFetch=window.fetch.bind(window);window.fetch=(u,o)=>{if(new URL(u,location.href).origin!==location.origin)throw Error('隔離預覽禁止連外');return localFetch(u,o);};
 const index=await(await fetch('index.html',{cache:'no-store'})).text(),style=document.createElement('style');style.textContent=index.match(/<style>([\s\S]*?)<\/style>/)[1];document.head.prepend(style);
 const doc=new DOMParser().parseFromString(index,'text/html');for(const link of doc.head.querySelectorAll('link[rel="stylesheet"]'))document.head.append(link);for(const script of doc.body.querySelectorAll('script'))script.remove();for(const child of [...doc.body.children])document.body.append(child);
 for(const[,file,version]of index.matchAll(/<script src="(data\/[^"?]+\.js)\?v=([^"]+)"/g))if(!['data/main.js','data/pwa.js'].includes(file))await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=file+'?v='+version+'&preview=message-button-v1';s.onload=resolve;s.onerror=reject;document.head.append(s);});
 SIM_MODE=true;sfx=()=>{};saveGame=()=>{};createPlayer('訊息按鈕測試','gunner',CLASSES.gunner.base);player.lv=35;addItem('rifle');equipItem(player.inv.find(it=>it.id==='rifle').uid,true);addItem('polyScroll');usePotion('polyScroll','m06');
 addItem('map1');const previewSword=addItem('longSword');previewSword.q='rare';previewSword.nm='晨星';previewSword.il=40;player.loc={type:'town',id:'talking'};player.hunting=false;
 window.messagePreviewMode=mode=>{displayMode=mode;layoutFrame();refreshUI();};
 showScreen('game');displayMode='pc';SIM_MODE=false;layoutFrame();refreshUI();
 isCloudConfigured=()=>true;cloudLoggedIn=()=>true;cloudCanCall=()=>false;marketDeliver=async()=>{};
 const sampleRows=[{id:1,item:{id:'longSword',n:1,ench:3},n:1,name:'長劍',seller_name:'灰燼騎士',start_price:5,bid_amount:8,is_seller:false,is_bidder:false,state:'active',ends_at:new Date(Date.now()+3600000).toISOString()}, {id:2,item:{id:'map1',n:1},n:1,name:'異界地圖 T1',seller_name:'你',start_price:5,bid_amount:0,is_seller:true,is_bidder:false,state:'active',ends_at:new Date(Date.now()+7200000).toISOString()}];
 marketRpc=async(fn,args)=>{if(fn==='auction_browse')return {rows:args.p_mine?sampleRows.filter(r=>r.is_seller):sampleRows,diamonds:38,status:auctionStatus,registered:false,queue_count:12};throw Error('隔離預覽：不送出交易，待安裝拍賣SQL');};
 marketView='auction';auctionRows=sampleRows;auctionStatus={phase:'active',ends_at:new Date(Date.now()+3600000).toISOString(),server_now:new Date().toISOString(),min_rank:2,min_il:0,equipment_only:true,allowed_ids:['bWeaponScroll','bArmorScroll','curAwaken','curOracle'],allowed_cats:['doll'],draw_mode:'round'};diaCount=38;switchTab('market');
 if(new URLSearchParams(location.search).has('db')){
  marketRpc=async(fn,args={})=>{const r=await(await localFetch('/__auction_rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fn,args})})).json();if(r.error)throw Error(r.error);return r.data;};
  await marketRpc('init',{player});
  vaultOp=async(fn,args,apply)=>{const r=await marketRpc(fn,Object.assign({p_slot:0},args));apply(r);refreshUI();};
  await auctionLoad();
  const finish=document.createElement('button');finish.textContent='測試：結束本輪';finish.onclick=async()=>{await marketRpc('finish-preview');await auctionLoad();};document.getElementById('message-preview-tools').append(finish);
 }
 setInterval(()=>{gameNow+=100;},100);
})().catch(e=>{document.body.append('預覽錯誤：'+e.stack);console.error(e);});
</script></body></html>
