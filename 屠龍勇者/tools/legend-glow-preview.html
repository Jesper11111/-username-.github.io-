<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><base href="../"><title>傳說裝備呼吸光暈</title>
<style>body{margin:20px;background:#17130f;color:#eadfca;font:15px sans-serif;height:auto!important;overflow:auto!important}#glow-preview{max-width:1100px;margin:auto;padding-bottom:24px}#glow-preview h1{color:#edc36e;font-size:24px}#glow-preview select{padding:8px}#glow-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}#glow-grid article{padding:12px 8px;text-align:center;background:#251e15;border:1px solid #635032;border-radius:8px}#glow-grid .big{width:70px;height:70px;margin:3px auto 12px}#glow-grid .small{display:inline-block;width:30px;height:30px;margin-top:12px}#glow-grid small{display:block;margin:5px;color:#b4a88c}#glow-grid img{object-fit:contain}#glow-ui .list{max-height:none}#glow-ui .cv{min-height:580px}#glow-status{color:#d1bd92;margin:12px 0 20px}</style>
<main id="glow-preview"><h1>傳說裝備・金色呼吸光暈</h1><label>顯示 <select id="glow-view"><option value="all">全部 28 件傳說裝備</option><option value="bag">實際背包</option><option value="char">實際角色裝備</option><option value="craft">實際鍛造清單</option></select></label><p id="glow-status">載入中…</p><div id="glow-grid"></div><section id="glow-ui"></section></main><div id="dialog-layer"></div>
<script>
function glowPreviewDetail(id){const sim=SIM_MODE;try{SIM_MODE=false;selectCodex(id);}finally{SIM_MODE=sim;}}
(async()=>{
const html=await(await fetch('index.html')).text(),css=document.createElement('style');css.textContent=html.match(/<style>([\s\S]*?)<\/style>/)[1];document.head.prepend(css);
for(const[,file,ver]of html.matchAll(/<script src="(data\/[^"?]+\.js)\?v=([^"]+)"/g)){if(/\/(main|pwa|cloud)\.js$/.test(file))continue;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=file+'?v='+ver;s.onload=resolve;s.onerror=reject;document.head.append(s);});}
SIM_MODE=true;sfx=()=>{};createPlayer('傳說裝備預覽','knight',CLASSES.knight.base);player.inv=[];
const ids=Object.keys(ITEMS).filter(id=>['weapon','armor'].includes(ITEMS[id].cat)&&codexGradeOf(id).id==='legend');
ids.forEach(id=>addItem(id,1));
for(const id of ['dragonSlayer','dragonWardHelm','dragonScaleMail','dragonWingCloak','earthGuard','dragonHeartTunic','dragonFangGloves','dragonWardBoots','tideHeart','dragonHeartRing'])equipItem(player.inv.find(x=>x.id===id).uid,true);
function render(){const view=document.getElementById('glow-view').value,grid=document.getElementById('glow-grid'),ui=document.getElementById('glow-ui');grid.hidden=view!=='all';grid.style.display=view==='all'?'grid':'none';ui.hidden=view==='all';
if(view==='all'){ui.innerHTML='';grid.innerHTML=ids.map(id=>'<article><div class="big">'+itemIconHtml(id)+'</div><b>'+esc(ITEMS[id].name)+'</b><small>'+codexKind(ITEMS[id])+'</small><div class="small">'+itemIconHtml(id)+'</div><small><button onclick="glowPreviewDetail(\''+id+'\')">介紹</button></small></article>').join('');}
else{grid.innerHTML='';ui.innerHTML=view==='bag'?renderBag():view==='char'?renderChar():renderCraft();}
const imgs=Array.from(document.querySelectorAll('#glow-preview img'));Promise.all(imgs.map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=r;im.onerror=r;}))).then(()=>{document.getElementById('glow-status').textContent='版本 '+GAME_VERSION+'｜傳說裝備 '+ids.length+' 件｜缺圖 '+imgs.filter(im=>!im.naturalWidth).length+'｜隔離預覽，不讀寫存檔／不上傳。';});}
document.getElementById('glow-view').onchange=render;render();
})().catch(e=>{document.getElementById('glow-status').textContent=e.stack;console.error(e);});
</script></html>
