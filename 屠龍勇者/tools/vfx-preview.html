<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../">
<title>黑暗大陸・附魔特效檢查</title>
<style>
body{margin:0;background:#121116;color:#e1d7c5;font:15px sans-serif}header{padding:18px;position:sticky;top:0;background:#201d29;z-index:1}h1{font-size:20px;margin:0 0 10px}button{background:#413653;color:inherit;padding:8px;border:1px solid #8e739e;border-radius:5px}input{vertical-align:middle;width:220px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:12px}article{background:#201d29;border:1px solid #4d4057;border-radius:8px;padding:8px}canvas{display:block;width:100%;height:auto}h2{font-size:15px;margin:5px}p{margin:8px 0 0;color:#c3b5cc}
</style>
<header><h1>25 種附魔特效</h1><button id="play">暫停</button> <label>播放位置 <input id="age" type="range" min="0" max="3999" value="600"></label><p id="loaded">載入圖片中…</p><p>僅檢查繪圖，不建立角色、不讀寫存檔、不連接雲端。</p></header>
<main id="cards"></main>
<script src="data/config.js?v=20261021b"></script>
<script>
const BOSS_ENCHANTS = {
    treantHeart:{name:'古樹荊棘'},drakeFang:{name:'裂地岩刺'},baphometHorn:{name:'地獄火柱'},
    demonHeart:{name:'噬魂黑炎'},wyvernWing:{name:'疾風連刃'},osirisSeal:{name:'冥界封咒'},
    frostCrystal:{name:'冰王碎晶'},ifritFlame:{name:'煉獄火域'},forgottenRelic:{name:'遺忘烙印'},
    giantSoul:{name:'巨人崩擊'},antharasScale:{name:'地龍震怒'},fafurionScale:{name:'水龍海嘯'},
    lindviorScale:{name:'風龍風暴'},valakasScale:{name:'火龍吐息'},towerBansheeTear:{name:'女妖哀嚎'},
    towerFlameCore:{name:'炎魔爆燃'},towerLichCrystal:{name:'死亡纏繞'},towerFallenFeather:{name:'墮天裁決'},
    towerChaosCore:{name:'混沌裂爆'},towerAbyssEye:{name:'深淵侵蝕'},towerBullHorn:{name:'蠻牛震擊'},
    towerIceCrown:{name:'冰后寒獄'},pirateTreasure:{name:'幽靈砲擊'},towerDeathShard:{name:'死神收割'},towerKingSeal:{name:'冥王追擊'}
};
</script>
<script src="data/boss-vfx.js?v=20261021b"></script>
<script>
let vfxGalleryPlaying = true, vfxGalleryStart = null;
const vfxGalleryCards = BOSS_VFX_IDS.map(id => {
    const card = document.createElement('article'), title = document.createElement('h2'), canvas = document.createElement('canvas');
    title.textContent = BOSS_ENCHANTS[id].name; canvas.width = 420; canvas.height = 280;
    card.append(title, canvas); document.getElementById('cards').append(card);
    return { id, ctx: canvas.getContext('2d') };
});
document.getElementById('play').addEventListener('click', () => {
    vfxGalleryPlaying = !vfxGalleryPlaying;
    document.getElementById('play').textContent = vfxGalleryPlaying ? '暫停' : '播放';
    vfxGalleryStart = null;
});
document.getElementById('age').addEventListener('input', () => {
    vfxGalleryPlaying = false; document.getElementById('play').textContent = '播放';
});
function vfxGalleryDraw(now) {
    if (vfxGalleryStart === null) vfxGalleryStart = now - Number(document.getElementById('age').value);
    const elapsed = vfxGalleryPlaying ? (now - vfxGalleryStart) % 4000 : Number(document.getElementById('age').value);
    if (vfxGalleryPlaying) document.getElementById('age').value = Math.floor(elapsed);
    for (const card of vfxGalleryCards) drawBossVfxPreview(card.ctx, card.id, elapsed, Math.floor(now / 4000) % 2 === 1);
    const loaded = Object.values(bossVfxImages).filter(im => im.complete && im.naturalWidth).length;
    document.getElementById('loaded').textContent = '已載入 ' + loaded + '／25 套圖片';
    requestAnimationFrame(vfxGalleryDraw);
}
requestAnimationFrame(vfxGalleryDraw);
</script>
</html>
